<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="compactGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0070f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052cc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="16" cy="16" r="15" fill="url(#compactGradient)" stroke="#ffffff" stroke-width="1" opacity="0.9"/>

  <!-- Simplified icon - data flow -->
  <g transform="translate(8, 8)">
    <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="6" cy="2" r="1.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="6" cy="6" r="1.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="10" cy="6" r="1.5" fill="#ffffff" opacity="0.9"/>

    <!-- Connecting lines -->
    <path d="M2 2 L6 2 L6 6 L10 6" stroke="#ffffff" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Small accent -->
  <circle cx="26" cy="6" r="2" fill="#ffffff" opacity="0.6"/>
</svg>
