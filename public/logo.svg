<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0070f3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0052cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003399;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Main logo container -->
  <rect width="200" height="60" rx="8" fill="url(#logoGradient)" filter="url(#shadow)"/>

  <!-- Icon elements (representing business/data) -->
  <g transform="translate(15, 15)">
    <!-- Data flow lines -->
    <path d="M5 5 L15 5 L15 15 L25 15" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
    <circle cx="5" cy="5" r="2" fill="white" opacity="0.9"/>
    <circle cx="15" cy="5" r="2" fill="white" opacity="0.9"/>
    <circle cx="15" cy="15" r="2" fill="white" opacity="0.9"/>
    <circle cx="25" cy="15" r="2" fill="white" opacity="0.9"/>

    <!-- Connection dots -->
    <circle cx="8" cy="8" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="12" cy="12" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="18" cy="8" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="22" cy="12" r="1.5" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Salesforce text -->
  <text x="55" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    Salesforce
  </text>

  <!-- Subtitle -->
  <text x="55" y="42" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" opacity="0.9">
    Business Management Platform
  </text>

  <!-- Decorative elements -->
  <g transform="translate(160, 10)">
    <!-- Chart-like elements -->
    <rect x="0" y="15" width="4" height="25" fill="#ffffff" opacity="0.6" rx="1"/>
    <rect x="6" y="8" width="4" height="32" fill="#ffffff" opacity="0.7" rx="1"/>
    <rect x="12" y="12" width="4" height="28" fill="#ffffff" opacity="0.6" rx="1"/>
    <rect x="18" y="5" width="4" height="35" fill="#ffffff" opacity="0.8" rx="1"/>
  </g>

  <!-- Accent line -->
  <rect x="0" y="55" width="200" height="2" fill="#ffffff" opacity="0.3"/>
</svg>