<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1D4ED8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Main logo container with shadow -->
  <g filter="url(#shadow)">
    <!-- CRM/ERP Icon -->
    <rect x="8" y="12" width="44" height="36" rx="6" fill="url(#logoGradient)"/>
    <rect x="10" y="14" width="40" height="32" rx="4" fill="white" opacity="0.9"/>

    <!-- Chart bars -->
    <rect x="14" y="30" width="4" height="12" fill="url(#accentGradient)"/>
    <rect x="20" y="26" width="4" height="16" fill="url(#logoGradient)"/>
    <rect x="26" y="22" width="4" height="20" fill="url(#accentGradient)"/>
    <rect x="32" y="18" width="4" height="24" fill="url(#logoGradient)"/>
    <rect x="38" y="34" width="4" height="8" fill="url(#accentGradient)"/>

    <!-- Gear icon -->
    <circle cx="42" cy="20" r="6" fill="url(#accentGradient)"/>
    <circle cx="42" cy="20" r="3" fill="white"/>
    <rect x="40.5" y="15" width="3" height="3" rx="1" fill="white"/>
    <rect x="40.5" y="21" width="3" height="3" rx="1" fill="white"/>
    <rect x="37" y="17.5" width="3" height="3" rx="1" fill="white"/>
    <rect x="43" y="17.5" width="3" height="3" rx="1" fill="white"/>
  </g>

  <!-- Text elements -->
  <text x="60" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2937">CRM</text>
  <text x="60" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#10B981">ERP</text>
  <text x="100" y="25" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Platform</text>
  <text x="100" y="42" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF">Business Management</text>
</svg>
