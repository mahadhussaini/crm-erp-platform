<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="squareGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0070f3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0052cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003399;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="squareShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Main square background -->
  <rect width="100" height="100" rx="15" fill="url(#squareGradient)" filter="url(#squareShadow)"/>

  <!-- Central icon -->
  <g transform="translate(20, 20)">
    <!-- Data flow visualization -->
    <circle cx="10" cy="10" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="30" cy="10" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="30" cy="30" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="50" cy="30" r="4" fill="#ffffff" opacity="0.9"/>

    <!-- Connecting lines -->
    <path d="M10 10 L30 10 L30 30 L50 30" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>

    <!-- Additional connection points -->
    <circle cx="15" cy="15" r="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="25" cy="15" r="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="35" cy="25" r="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="45" cy="25" r="2" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Accent elements -->
  <g transform="translate(70, 10)">
    <!-- Mini chart bars -->
    <rect x="0" y="10" width="6" height="25" fill="#ffffff" opacity="0.7" rx="1"/>
    <rect x="8" y="5" width="6" height="30" fill="#ffffff" opacity="0.8" rx="1"/>
    <rect x="16" y="15" width="6" height="20" fill="#ffffff" opacity="0.7" rx="1"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="90" width="100" height="3" fill="#ffffff" opacity="0.4"/>
</svg>
