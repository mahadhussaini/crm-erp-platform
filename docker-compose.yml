version: '3.8'

services:
  # Main application with SQLite database
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-erp-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-super-secret-key-here
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped
    networks:
      - crm-erp-network

  # SQLite database (file-based, no separate container needed)
  # Database file will be created automatically in the app container

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: crm-erp-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - crm-erp-network

  # Nginx reverse proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: crm-erp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - crm-erp-network

volumes:
  sqlite_data:

networks:
  crm-erp-network:
    driver: bridge
