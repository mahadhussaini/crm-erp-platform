version: '3.8'

services:
  # Development application with hot reload
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: crm-erp-app-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - sqlite_dev_data:/app
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/dev.db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-key-change-in-production
    restart: unless-stopped
    networks:
      - crm-erp-network
    command: npm run dev

  # SQLite database (file-based, no separate container needed)
  # Database file will be created automatically in the app container

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: crm-erp-redis-dev
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - crm-erp-network

volumes:
  sqlite_dev_data:

networks:
  crm-erp-network:
    driver: bridge
